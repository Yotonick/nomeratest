<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Рулетка Госномеров</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#9aa3ad}
:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --accent:#9aa3ad;
  --ink:#f2f1f5;
  --dim:#8b8795;
  --panel:#1d1c21;
  --line:#2c2a33;
  --green:#34d058;
  --plate-font:'Barlow Condensed','Bahnschrift','DIN Condensed','Arial Narrow',sans-serif;
  --body-font:'Manrope',system-ui,-apple-system,sans-serif;
  transition:--accent .5s ease;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#050407;color:var(--ink);font-family:var(--body-font);-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

.glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(75% 34% at 50% 36%, color-mix(in srgb,var(--accent) 38%,transparent), transparent 70%),
    radial-gradient(120% 55% at 50% 0%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 70%);
}
#app{
  position:relative;z-index:1;max-width:440px;margin:0 auto;
  padding:10px 14px 14px;
  display:flex;flex-direction:column;gap:12px;
  min-height:100vh;min-height:100dvh;
}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lvl{height:42px;border-radius:21px;background:var(--panel);border:1px solid var(--line);padding:0 16px 0 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
.lvl .bar{width:54px;height:6px;border-radius:3px;background:#34323b;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .4s ease}
.lvl:active{transform:scale(.96)}
.bal{text-align:right}
.bal small{display:block;font-size:11px;color:var(--dim);font-weight:600}
.bal b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;transition:color .3s}
.bal b.up{color:#4ade80}.bal b.down{color:#fb7185}

/* rarity panel */
.rarity{
  background:rgba(255,255,255,.055);border-radius:22px;padding:13px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.r-name{font-weight:800;font-size:16px;color:var(--accent);margin-bottom:8px;line-height:1}
.dots{display:flex;gap:4px}
.dots i{display:block;width:15px;height:4px;border-radius:2px;background:#36343d}
.dots i.on{background:var(--accent)}
.r-price{font-weight:800;font-size:clamp(24px,8vw,33px);color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;line-height:1}

/* plate */
.plate-wrap{container-type:inline-size;width:100%}
.plate{
  background:#ecece9;border-radius:3.6cqw;padding:1cqw;
  box-shadow:0 3cqw 8cqw -2cqw rgba(0,0,0,.8), 0 0 10cqw -2cqw color-mix(in srgb,var(--accent) 45%,transparent);
}
.plate-in{
  display:flex;align-items:stretch;height:22cqw;
  border:1.3cqw solid #101010;border-radius:2.8cqw;
  background:linear-gradient(#f7f7f4,#e6e6e2);overflow:hidden;
}
.plate-main{flex:1;display:flex;align-items:center;justify-content:space-evenly;padding:0 1.5cqw}
.reel{overflow:hidden;position:relative;width:11.6cqw;height:17cqw;color:#0e0e0e}
.reel.letter{width:11.2cqw}
.reel-strip{will-change:transform}
.cell{height:17cqw;display:flex;align-items:center;justify-content:center;font-family:var(--plate-font);font-weight:600;font-size:17.5cqw;line-height:1;font-variant-numeric:tabular-nums}
.plate-region{
  flex:0 0 24.5cqw;border-left:1.3cqw solid #101010;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.6cqw 0 1cqw;
}
.region-reels{display:flex}
.reel.region{width:8.4cqw;height:12.4cqw}
.reel.region .cell{height:12.4cqw;font-size:15.5cqw}
.rus-row{display:flex;align-items:center;gap:1.4cqw;margin-top:.4cqw}
.rus-row span{font-family:var(--plate-font);font-weight:700;font-size:6.6cqw;line-height:1;color:#0e0e0e;letter-spacing:.01em}
.flag{width:9.6cqw;height:6.4cqw;border:.25cqw solid #0003;border-radius:.5cqw;overflow:hidden;display:flex;flex-direction:column}
.flag i{flex:1}.flag i:nth-child(1){background:#fff}.flag i:nth-child(2){background:#1b50a8}.flag i:nth-child(3){background:#d12a2a}

.caption{text-align:center;color:#6f6b79;font-size:14px;font-weight:500;min-height:20px;margin-top:-2px}
.breakdown{display:flex;flex-direction:column;gap:5px;text-align:center;font-size:15px;color:#a29eae}
.breakdown b{color:var(--accent);font-weight:800;margin-left:5px}
.breakdown .none{color:var(--dim)}

/* actions */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:6px}
.row{display:flex;gap:10px}
.hint{text-align:center;color:var(--dim);font-size:13px;line-height:1.4}

.spin{
  position:relative;overflow:hidden;
  height:74px;border-radius:37px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(180deg,#43e873 0%,#25c553 100%);
  color:#04210d;font-size:23px;font-weight:800;letter-spacing:.01em;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -4px 0 rgba(0,0,0,.14) inset,0 12px 34px -6px rgba(52,208,88,.7);
  animation:pulse 2.4s ease-in-out infinite;
  transition:transform .1s;
}
.spin::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 3.6s ease-in-out infinite}
.spin:active{transform:scale(.97)}
.spin .cost{background:rgba(0,0,0,.17);border-radius:18px;padding:5px 12px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.spin:disabled{background:#2a2830;color:#6a6672;box-shadow:none;animation:none}
.spin:disabled::after{display:none}
.spin:disabled .cost{background:rgba(255,255,255,.06)}
@keyframes pulse{50%{box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -4px 0 rgba(0,0,0,.14) inset,0 14px 44px -4px rgba(52,208,88,.95)}}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.spin,.spin::after{animation:none}}

.pill{flex:1;height:60px;border-radius:30px;font-size:17px;font-weight:800;background:var(--panel);color:#fff}
.pill:active{transform:scale(.98)}
.pill.ghost{background:transparent;border:1.5px solid var(--line);color:#c9c6d2;height:48px;font-size:15px}
.pill.green{background:var(--green);color:#04210d;height:58px}
.share{flex:0 0 60px;width:60px;height:60px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center}
.share svg{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f2f1f5;color:#111;padding:10px 18px;border-radius:20px;font-weight:700;font-size:14px;z-index:60;text-align:center;max-width:90vw}

/* sheets */
.back{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;max-height:90vh;overflow:auto;background:#17161a;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:44px;height:5px;border-radius:3px;background:#3a3841;align-self:center;margin-bottom:4px}
.sheet h2{margin:0;font-size:20px;font-weight:800;text-align:center}
.share-img{display:block;max-height:58vh;max-width:100%;margin:0 auto;border-radius:20px;object-fit:contain}
.tier-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tier-row:last-child{border:none}.tier-row span:last-child{color:var(--dim)}

/* profile screen */
.prof{position:fixed;inset:0;z-index:20;background:#08070b;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
.prof-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.prof-head{display:flex;align-items:center;justify-content:center;position:relative;height:48px;margin-bottom:2px}
.back-btn{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;background:var(--panel);font-size:20px;display:flex;align-items:center;justify-content:center}
.prof-head h2{margin:0;font-size:20px;font-weight:800}
.card{background:#1a191e;border-radius:22px;padding:16px 18px}
.lv-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.lv-top b{font-size:26px;font-weight:800}
.lv-top span{color:var(--dim);font-size:13px;font-weight:600}
.xp{height:10px;border-radius:5px;background:#2c2a33;overflow:hidden;margin-bottom:12px}
.xp i{display:block;height:100%;background:var(--green);border-radius:5px}
.lv-note{color:var(--dim);font-size:13.5px;line-height:1.45;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card{padding:14px 16px}
.big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.big.gold{color:#facc15}
.sm{color:var(--dim);font-size:12.5px;margin-top:3px}
.sec{font-size:13px;font-weight:700;color:#a29eae;margin:8px 0 -2px 4px;display:flex;justify-content:space-between;align-items:center}
.card.plate-card{padding:14px}
.sum{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:14px}
.sum b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.sell-all{height:46px;border-radius:23px;background:#f2f1f5;color:#111;font-weight:800;font-size:15px;width:100%}
.inv{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:18px;padding:12px}
.mini{font-family:var(--plate-font);font-weight:600;font-size:21px;line-height:1;color:#0e0e0e;background:linear-gradient(#f7f7f4,#e6e6e2);border:3px solid #101010;border-radius:8px;padding:5px 9px;white-space:nowrap;flex:0 0 auto}
.inv-i{flex:1;min-width:0}
.inv-i .t{font-weight:800;font-size:13px}
.inv-i .rg{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sell-one{flex:0 0 auto;background:#2a2830;border-radius:16px;padding:9px 12px;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:26px 12px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:18px;font-size:14px}
.link-btn{height:48px;border-radius:24px;background:var(--panel);font-weight:700;font-size:15px;color:#c9c6d2}

/* ===== v3 additions ===== */
html,body{overflow-x:hidden}
.top{position:relative}
.top-r{display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:21px;height:21px}
.icon-btn:active{transform:scale(.94)}
.icon-btn .dot{position:absolute;top:-1px;right:-1px;width:12px;height:12px;border-radius:50%;background:#fb7185;border:2px solid #050407}
.icon-btn.has .dot{display:block}.icon-btn .dot{display:none}
.icon-btn.has svg{animation:wiggle 2.2s ease-in-out infinite}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-12deg)}85%{transform:rotate(12deg)}95%{transform:rotate(-6deg)}}
.bal{position:relative;min-width:96px}
.delta{position:absolute;right:0;top:100%;font-weight:800;font-size:15px;white-space:nowrap;pointer-events:none;animation:floatUp 1.3s ease-out forwards;z-index:5}
.delta.up{color:#4ade80}.delta.down{color:#fb7185}
@keyframes floatUp{0%{opacity:0;transform:translateY(-6px)}15%{opacity:1}100%{opacity:0;transform:translateY(22px)}}

.tabs{display:flex;background:var(--panel);border-radius:22px;padding:4px;gap:4px}
.tab{flex:1;height:38px;border-radius:18px;background:transparent;color:var(--dim);font-weight:800;font-size:14.5px}
.tab.on{background:#2c2a33;color:#fff}
.tab:disabled{opacity:.5}

.plate-wrap{position:relative}
.plate{position:relative;z-index:1}
.plate.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.07)}100%{transform:scale(1)}}
.rays{position:absolute;left:50%;top:50%;width:125cqw;height:125cqw;margin:-62.5cqw 0 0 -62.5cqw;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .6s;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--accent) 70%,transparent) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 64%);mask:radial-gradient(circle,#000 0,transparent 64%)}
.rays.on{opacity:.5;animation:rayspin 16s linear infinite}
@keyframes rayspin{to{transform:rotate(360deg)}}
.plate.shine::after{content:"";position:absolute;inset:0;border-radius:3.6cqw;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-120%);animation:shine 1s ease-out .15s forwards;pointer-events:none}
@keyframes shine{to{transform:translateX(120%)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}
.flash{position:fixed;inset:0;pointer-events:none;z-index:54;animation:flash .8s ease-out forwards}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
#app.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
@media (prefers-reduced-motion:reduce){#app.shake,.rays.on,.icon-btn.has svg{animation:none}}

.bet-btn{height:52px;border-radius:26px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 20px;width:100%;font-size:15px;font-weight:800;border:1px solid var(--line)}
.bet-btn small{color:var(--dim);font-weight:600;font-size:12px;display:block;text-align:left}
.bet-btn .chev{color:var(--dim);font-size:18px}
.bet-btn:disabled{opacity:.5}
.spin-row{display:flex;gap:10px}
.spin-row .spin{flex:1;width:auto}
.auto{flex:0 0 74px;width:74px;height:74px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line);font-size:13px;font-weight:800;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.auto svg{width:22px;height:22px}
.auto.on{background:#3b1820;border-color:#fb7185;color:#fb7185}
.auto:disabled{opacity:.45}

.cases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.case{position:relative;border-radius:24px;padding:16px 8px 14px;background:radial-gradient(90% 70% at 50% 15%,color-mix(in srgb,var(--c) 22%,#1c1b20),#1c1b20 75%);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.case:active{transform:scale(.97)}
.case svg{width:62px;height:62px;filter:drop-shadow(0 6px 12px color-mix(in srgb,var(--c) 45%,transparent))}
.case b{font-size:14.5px;font-weight:800;line-height:1.15}
.case .pr{font-size:18px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.case .ch{font-size:12px;color:var(--dim)}
.case .badge{position:absolute;top:10px;right:10px;background:#34d058;color:#04210d;font-weight:800;font-size:12px;border-radius:12px;padding:2px 8px}
.case.dis .pr{opacity:.45}

.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:70;pointer-events:none;width:92vw;max-width:420px}
.toasts .toast{position:static;transform:none;animation:tin .25s ease-out}
.toast.ach{background:#241f10;color:#fde68a;border:1px solid #facc15}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

.menu{display:flex;flex-direction:column;gap:8px}
.menu-i{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-radius:18px;padding:14px 16px;font-weight:700;font-size:15px;width:100%;text-align:left}
.menu-i span:last-child{color:var(--dim);font-size:13.5px;font-weight:600}
.dnote{color:var(--dim);font-size:13.5px;text-align:center;line-height:1.4;margin:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--panel);border-radius:14px;padding:8px 2px;text-align:center;font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:4px;align-items:center;border:1.5px solid transparent;min-height:78px;justify-content:center}
.day b{font-size:12px;color:var(--ink)}
.day.done{background:#12301d;color:#4ade80;border-color:#1f6b38}
.day.now{border-color:#facc15;background:#2a2410}
.day svg{width:22px;height:22px}
.streak{text-align:center;font-weight:800;font-size:30px}
.streak small{display:block;font-size:13px;color:var(--dim);font-weight:600;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:18px;background:var(--panel);font-weight:700;font-size:14px;border:1.5px solid transparent}
.chip.on{border-color:var(--green);color:var(--green)}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:18px;padding:14px 16px;font-weight:700;font-size:14.5px;width:100%}
.sw{width:46px;height:28px;border-radius:14px;background:#3a3841;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(18px)}
.bet-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;text-align:left;width:100%;background:transparent;border-bottom:1px solid #3a3841}
.bet-row:last-child{border:none}
.bet-row .n{font-weight:800;font-size:17px}.bet-row .s{font-size:13px;color:var(--dim);margin-top:2px}
.bet-row .p{font-weight:800;font-size:16px;display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.bet-list{background:#26252b;border-radius:22px;overflow:hidden}
.chk{width:30px;height:30px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#04210d;font-size:16px}
.chk.no{background:transparent}
.sheet p.d{margin:0;color:#a29eae;font-size:14.5px;line-height:1.45;text-align:center}
.big-box{display:flex;justify-content:center}
.big-box svg{width:96px;height:96px}
.odds{background:#26252b;border-radius:18px;padding:4px 14px}
.odds .tier-row{padding:8px 0}
.ach{display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:18px;padding:12px 14px}
.ach.ok{background:#241f10;border:1px solid #6b5a14}
.ach .ic{font-size:26px;width:40px;text-align:center;filter:grayscale(1);opacity:.5}
.ach.ok .ic{filter:none;opacity:1}
.ach .tx{flex:1;min-width:0}
.ach .tt{font-weight:800;font-size:14.5px}
.ach .ds{font-size:12.5px;color:var(--dim);margin:2px 0 6px}
.ach .pb{height:5px;border-radius:3px;background:#34323b;overflow:hidden}
.ach .pb i{display:block;height:100%;background:var(--green)}
.ach.ok .pb i{background:#facc15}
.ach .rw{font-size:12.5px;font-weight:800;color:#facc15;white-space:nowrap}
.barrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.barrow .nm{flex:0 0 108px;font-weight:700}
.barrow .tr{flex:1;height:8px;border-radius:4px;background:#2c2a33;overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:4px}
.barrow .ct{flex:0 0 auto;min-width:56px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.srow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}

function buildReel(id,target,spins,delay,dur){
  var strip=$(id).querySelector('.reel-strip');
  strip.style.transition='none'; strip.style.transform='translateY(0)'; strip.innerHTML='';
  var seq=[]; for(var i=0;i<spins;i++) seq.push(pick(POOLS[id])); seq.push(target);
  seq.forEach(function(ch){ var d=document.createElement('div'); d.className='cell'; d.textContent=ch; strip.appendChild(d); });
  if(!spins) return;
  void strip.offsetHeight;
  var shift=(seq.length-1)/seq.length*100; // % of strip height — stays correct on resize
  requestAnimationFrame(function(){
    strip.style.transition='transform '+dur+'ms cubic-bezier(.15,.65,.2,1) '+delay+'ms';
    strip.style.transform='translateY(-'+shift+'%)';
  });
}

var particles=[], fxRAF=0;
function burst(n,color){
  var cv=$('fx'), dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  var sc=$('caseScr'), r=(!sc.hidden?sc:($('stage').hidden?plateWrapEl():$('stage'))).getBoundingClientRect();
  var cx=(r.left+r.width/2)*dpr, cy=(r.top+r.height/2)*dpr;
  var cols=[color,'#ffffff',color,'#facc15'];
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, sp=(4+Math.random()*12)*dpr;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6*dpr,s:(4+Math.random()*7)*dpr,
      rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1,dpr:dpr});
  }
  if(!fxRAF) fxRAF=requestAnimationFrame(fxStep);
}
function fxStep(){
  var cv=$('fx'), ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  particles=particles.filter(function(p){ return p.life>0&&p.y<cv.height+40; });
  particles.forEach(function(p){
    p.vy+=.35*p.dpr; p.vx*=.992; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=.0085;
    ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));
    ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); ctx.restore();
  });
  if(particles.length) fxRAF=requestAnimationFrame(fxStep);
  else{ fxRAF=0; ctx.clearRect(0,0,cv.width,cv.height); }
}
var BURSTS=[0,0,24,60,110,150,190,240,300,380];
function revealFX(p){

  if(t>=3) $(car?'raysS':'rays').classList.add('on');

    var f=document.createElement('div'); f.className='flash';
    f.style.background='radial-gradient(circle at 50% 35%,'+col+',transparent 70%)';
    document.body.appendChild(f); setTimeout(function(){ f.remove(); },900);
  }
  if(t>=5){ var a=$('app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); setTimeout(function(){ a.classList.remove('shake'); },520); }

    var eg=eggOf(p); if(eg){ state.eggs[eg.id]=(state.eggs[eg.id]||0)+1; }
  }
  if(p.kind==='car') colNote(null,p.car.id); else colNote(plateText(p));
  state.xp+=XP_BY_TIER[p.tier.id];
  var gained=0, lvUp=false;
  while(state.xp>=xpNeed(state.level)){
    state.xp-=xpNeed(state.level); state.level++; lvUp=true; gained+=levelReward(state.level);
  }
  if(!state.best||p.value>state.best.value){
    state.best=p.kind==='car'?{kind:'car',carId:p.car.id,text:p.car.n,value:p.value,tierName:p.tier.name,tierColor:p.tier.color}
      :{text:plateText(p),regionCode:p.region[0],value:p.value,tierName:p.tier.name,tierColor:p.tier.color};
  }
  renderLevel();
  if(gained){ changeBalance(gained,true); toast('Уровень '+state.level+'! Награда +'+fmt(gained)); SND.level(); }
  save(); checkAch();
}

/* ================= ACTIONS ================= */
function startReveal(p,after){
  state.pending=p; save(); clearResult(); updateControls();
  if(p.kind!=='car') showStage(false);
  (p.kind==='car'?animateCase:animate)(p,function(){
    spinning=false; showResult(p); revealFX(p); applyReveal(p); updateControls();
    if(after) after(p);
  });
}
function doSpin(){
  if(spinning||state.pending) return;
  var b=curBet();
  if(state.balance<b.price){ SND.error(); return; }
  ac(); spinning=true;
  var p=rollPlate(minWeights(b.min),'roulette');
  changeBalance(-b.price,true);
  state.spins++; state.stats.roulette++; state.stats.spent+=b.price;
  if(state.bet>state.stats.maxBet) state.stats.maxBet=state.bet;
  if(auto.on) state.stats.auto++;
  startReveal(p,function(p){ if(auto.on) autoDecide(p); });
}
function openCase(i){
  if(spinning||state.pending) return;
  var c=CASES[i], free=state.cases[i]>0;
  if(!free&&state.balance<c.price){ SND.error(); toast('Не хватает денег на кейс'); return; }
  ac(); spinning=true; SND.caseOpen();
  if(free) state.cases[i]--; else { changeBalance(-c.price,true); state.stats.spent+=c.price; }
  state.spins++; state.stats.cases++; lastCase=i;
  var p=rollCar(c); p.caseIdx=i; p.cond=randInt(30,100);
  state.pending=p; save(); updateControls(); runCaseScr(p);
}
function sellCurrent(){
  var p=state.pending; if(!p||spinning) return;
  state.pending=null; state.stats.earned+=p.value; state.stats.sold++;
  SND.coin(); changeBalance(p.value); save(); updateControls();
}
function keepCurrent(){
  var p=state.pending; if(!p||spinning) return;
  var uid=Date.now()+'_'+Math.random().toString(36).slice(2);
  state.inventory.unshift(p.kind==='car'
    ?{id:uid,kind:'car',carId:p.car.id,text:p.car.n,region:CAR_TYPE[p.car.ty],value:p.value,tierName:p.tier.name,tierColor:p.tier.color}
    :{id:uid,text:plateText(p),regionCode:p.region[0],region:p.region[1],value:p.value,tierName:p.tier.name,tierColor:p.tier.color});
  state.pending=null; SND.click(); save(); updateControls(); checkAch();
  if(!auto.on) toast('Номер в гараже');
}
function restart(){
  state.balance=START_BALANCE; state.wheel={last:0}; state.tasks=null; $('caseScr').hidden=true; state.inventory=[]; state.pending=null; state.spins=0;
  state.level=1; state.xp=0; state.best=null; state.cases=padCases([]); state.bet=0; state.bp=null; state.ev=null; state.eggs={}; state.themeSel=null; clearEgg(); state.col=null; craftSel=[];
  state.daily={last:null,streak:0,best:0}; state.ach={}; state.stats=freshStats();
  stageMode=null; shownBal=state.balance; save(); renderBalance(); renderLevel(); renderBet(); clearResult(); updateControls();
}

/* ---------- auto ---------- */
function stopAuto(msg){
  if(!auto.on) return; auto.on=false; if(msg) toast(msg); updateControls();
}
function autoDecide(p){
  var keep=p.tier.id>=state.auto.keep;
  setTimeout(function(){
    if(!auto.on||state.pending!==p) return;
    if(keep){
      keepCurrent();
      if(state.auto.stop){ stopAuto('Автокрутка остановлена: ценный номер сохранён'); return; }
    }else sellCurrent();
    if(!auto.on) return;
    if(state.balance<curBet().price){ stopAuto('Автокрутка остановлена: не хватает денег'); return; }
    setTimeout(function(){ if(auto.on) doSpin(); },turboOn()?120:650);
  },turboOn()?(keep?900:(p.tier.id>=2?500:120)):(keep?2200:(p.tier.id>=2?1500:800)));
}
function startAuto(){
  if(state.pending||spinning){ toast('Сначала продай или оставь номер'); return; }
  if(state.balance<curBet().price){ SND.error(); toast('Не хватает денег на ставку'); return; }
  auto.on=true; updateControls(); doSpin();
}

  if(!okNum(state.balance)) state.balance=START_BALANCE;
  state.inventory.forEach(function(it){
    var t=TIERS[tierIdOf(it)], mid=Math.round(Math.sqrt(t.base[0]*t.base[1]));
    if(it.kind==='car'){
      if(!okNum(it.baseValue)) it.baseValue=(okNum(it.value)&&!it.plate)?it.value:mid;
      if(!okNum(it.value)) it.value=it.baseValue;
      if(it.plate){ if(!okNum(it.plate.value)) it.plate.value=Math.round(Math.sqrt(TIERS[tierIdOf(it.plate)].base[0]*TIERS[tierIdOf(it.plate)].base[1])); }
      else it.plate=null;

var PROMO_PUBKEY={"kty":"EC","crv":"P-256","x":"VvMawexw25iDGDVihPnricCWdU-A74UxJI5o_tPQG5I","y":"uKf5JiC83QS_pJ6aEVmzFDBMqNTaSLSrLnq-_mfcrqg"}; // ← вставь сюда ПУБЛИЧНЫЙ ключ из админ-страницы, например {"kty":"EC","crv":"P-256","x":"...","y":"..."}
var pubKeyObj=null;
function b64u2bytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var b=atob(s),a=new Uint8Array(b.length),i; for(i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function dayNum(){ return Math.floor(Date.now()/864e5); }
async function verifyCode(raw){
  var c=String(raw||'').replace(/\s+/g,'');
  if(c.indexOf('PR-')!==0) return null;
  var bytes; try{ bytes=b64u2bytes(c.slice(3)); }catch(e){ return null; }
  if(bytes.length!==79) return null;
  if(!PROMO_PUBKEY) return {err:'Промокоды не настроены: в игре не задан публичный ключ'};
  if(!pubKeyObj) pubKeyObj=await crypto.subtle.importKey('jwk',PROMO_PUBKEY,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  var ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pubKeyObj,bytes.slice(15),bytes.slice(0,15));
  if(!ok) return null;
  var dv=new DataView(bytes.buffer);
  return {code:c,type:bytes[0],v:dv.getUint32(1),n:dv.getUint16(5),exp:dv.getUint32(7)};
}
async function redeem(raw){
  var p; try{ p=await verifyCode(raw); }catch(e){ return 'Не удалось проверить код (нужен https или localhost)'; }

  if(p.err) return p.err;
  if(state.promo.used.indexOf(p.code)>=0) return 'Ты уже активировал этот промокод';
  if(p.exp&&dayNum()>p.exp) return 'Срок действия промокода истёк';
  var msg;
  if(p.type===0){ state.promo.used.push(p.code); changeBalance(p.v); msg='+'+fmt(p.v); }
  else if(p.type===1&&CASES[p.v]){ state.promo.used.push(p.code); state.cases[p.v]+=p.n; msg=CASES[p.v].name+' ×'+p.n; }

  else if(p.type===3){ state.promo.used.push(p.code); addBPXP(p.v); msg='+'+p.v+' XP Батл Пасса'; }
  else if(p.type===4&&p.v>0){ state.promo.used.push(p.code); addBPXP(p.v*BP_XP); msg='+'+p.v+' ур. Батл Пасса'; }
  else if(p.type===5&&CARS[p.v]){ var car=CARS[p.v], tr=TIERS[car.t]; state.promo.used.push(p.code);
    state.inventory.unshift({id:Date.now()+'_'+Math.random().toString(36).slice(2),kind:'car',carId:car.id,text:car.n,region:CAR_TYPE[car.ty],value:Math.round(logRand(tr.base[0],tr.base[1])),tierName:tr.name,tierColor:tr.color});
    msg='машина '+car.n; }
  else if(p.type===6){ var q=Math.floor(p.v/100),rg=REGIONS[p.v%100],dg=q%1000; q=Math.floor(q/1000); var lt=[Math.floor(q/144)%12,Math.floor(q/12)%12,q%12].map(function(k){return LETTERS[k];}), tr6=TIERS[Math.min(9,p.n)];
    if(!rg) return 'Промокод повреждён'; state.promo.used.push(p.code);
    var txt=lt[0]+('00'+dg).slice(-3)+lt[1]+lt[2];
    state.inventory.unshift({id:Date.now()+'_'+Math.random().toString(36).slice(2),text:txt,regionCode:rg[0],region:rg[1],value:Math.round(logRand(tr6.base[0],tr6.base[1])),tierName:tr6.name,tierColor:tr6.color});
    msg='номер '+txt+' '+rg[0]; }
  else if(p.type===7){ state.promo.used.push(p.code); state.turbo={own:true,on:true}; msg='⚡ Турбо-режим открыт'; }
  else return 'Промокод повреждён';
  SND.daily(); save(); updateControls(); try{ checkAch(); }catch(e){} toast('Промокод: '+msg,'ach');
  return 'ok';
}

function hexRGBA(hex,a){
  var n=parseInt(hex.slice(1),16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';
}
function rr(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawCard(p){
  var W=720,H=1120,c=document.createElement('canvas'); c.width=W; c.height=H;
  var ctx=c.getContext('2d'), acc=p.tier.color, body='Manrope, system-ui, sans-serif', pf='"Barlow Condensed","Arial Narrow",sans-serif';
  ctx.fillStyle='#050407'; ctx.fillRect(0,0,W,H);
  var g=ctx.createRadialGradient(W/2,520,20,W/2,520,540);
  g.addColorStop(0,hexRGBA(acc,.42)); g.addColorStop(1,hexRGBA(acc,0));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#f2f1f5'; ctx.font='800 38px '+body; ctx.fillText('Крути номера',W/2,120);
  ctx.fillStyle='#8b8795'; ctx.font='500 23px '+body; ctx.fillText('игра про блатные номера',W/2,160);
  ctx.fillStyle='#a29eae'; ctx.font='600 30px '+body; ctx.fillText('Я выбил номер',W/2,330);
  ctx.fillStyle=acc; ctx.font='800 96px '+body; ctx.fillText(p.tier.name,W/2,440);
  ctx.font='800 64px '+body; ctx.fillText(fmt(p.value),W/2,525);

  // plate (same proportions as on screen, u = 1cqw)
  var pw=640,u=pw/100,x=(W-pw)/2,y=590;
  ctx.fillStyle='#ecece9'; rr(ctx,x,y,pw,24*u,3.6*u); ctx.fill();
  var ix=x+u,iy=y+u,iw=pw-2*u,ih=22*u;
  var pg=ctx.createLinearGradient(0,iy,0,iy+ih); pg.addColorStop(0,'#f7f7f4'); pg.addColorStop(1,'#e6e6e2');
  rr(ctx,ix+.65*u,iy+.65*u,iw-1.3*u,ih-1.3*u,2.2*u); ctx.fillStyle=pg; ctx.fill();
  ctx.lineWidth=1.3*u; ctx.strokeStyle='#101010'; ctx.stroke();
  var right=ix+iw-1.3*u, dx=right-24.5*u, left=ix+1.3*u;
  ctx.fillStyle='#101010'; ctx.fillRect(dx,iy+.6*u,1.3*u,ih-1.2*u);
  var txt=plateText(p), slot=(dx-left)/6;
  ctx.fillStyle='#0e0e0e'; ctx.textBaseline='middle'; ctx.font='600 '+(17.5*u)+'px '+pf;
  for(var i=0;i<6;i++) ctx.fillText(txt[i],left+slot*(i+.5),iy+ih/2+.6*u);
  var cx=dx+1.3*u+(right-dx-1.3*u)/2;
  ctx.font='600 '+(15.5*u)+'px '+pf; ctx.fillText(p.region[0],cx,iy+8.6*u);
  ctx.font='700 '+(6.6*u)+'px '+pf;
  var rw=ctx.measureText('RUS').width, tot=rw+1.4*u+9.6*u, sx=cx-tot/2, ry=iy+18.1*u;
  ctx.textAlign='left'; ctx.fillText('RUS',sx,ry);
  var fx=sx+rw+1.4*u, fy=ry-3.2*u, fh=6.4*u/3;
  ctx.fillStyle='#fff'; ctx.fillRect(fx,fy,9.6*u,fh);
  ctx.fillStyle='#1b50a8'; ctx.fillRect(fx,fy+fh,9.6*u,fh);
  ctx.fillStyle='#d12a2a'; ctx.fillRect(fx,fy+2*fh,9.6*u,fh);
  ctx.lineWidth=1.2; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.strokeRect(fx,fy,9.6*u,6.4*u);

  // region + bonuses
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#6f6b79'; ctx.font='500 26px '+body;
  ctx.fillText('Регион '+p.region[0]+' · '+p.region[1],W/2,830);
  var ly=890;
  var lines=p.bonuses.length?p.bonuses:[{label:'Без особых комбинаций',mult:0}];
  lines.forEach(function(b){
    var m=b.mult?fmtMult(b.mult):'';
    ctx.textAlign='left'; ctx.font='500 28px '+body; var w1=ctx.measureText(b.label+' ').width;
    ctx.font='800 28px '+body; var w2=ctx.measureText(m).width;
    var lx=W/2-(w1+w2)/2;
    ctx.fillStyle='#a29eae'; ctx.font='500 28px '+body; ctx.fillText(b.label+' ',lx,ly);
    ctx.fillStyle=acc; ctx.font='800 28px '+body; ctx.fillText(m,lx+w1,ly);
    ly+=46;
  });
  return c;
}
function shareText(p){
  return 'Я выбил номер '+plateText(p)+' '+p.region[0]+' RUS — '+p.tier.name+', '+fmt(p.value);

function openShare(){
  var p=state.pending; if(!p||spinning) return;
  var load=Promise.all([
    document.fonts.load('600 40px "Barlow Condensed"'),
    document.fonts.load('800 40px Manrope'),
    document.fonts.load('500 40px Manrope')
  ]).catch(function(){});
  load.then(function(){
    var canvas=drawCard(p), url=canvas.toDataURL('image/png');
    var back=document.createElement('div'); back.className='back';
    back.innerHTML='<div class="sheet"><div class="grab"></div><h2>Похвастаться номером</h2>'+
      '<img class="share-img" alt="Карточка номера" src="'+url+'">'+
      '<button class="pill green" id="sendBtn">Отправить в чат</button></div>';
    back.addEventListener('click',function(e){ if(e.target===back) back.remove(); });
    document.body.appendChild(back);

function sendCard(canvas,p){
  canvas.toBlob(function(blob){
    if(!blob){ toast('Не удалось создать картинку'); return; }
    var file=new File([blob],'nomer.png',{type:'image/png'}), data={files:[file],text:shareText(p)};
    if(navigator.canShare && navigator.canShare(data) && navigator.share){
      navigator.share(data).catch(function(e){ if(e&&e.name!=='AbortError') clipFallback(blob); });
    }else clipFallback(blob);
  },'image/png');
}
function clipFallback(blob){
  try{
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(
      function(){ toast('Картинка скопирована — вставь её в чат'); },
      function(){ toast('Зажми картинку, чтобы сохранить или отправить'); });
  }catch(e){ toast('Зажми картинку, чтобы сохранить или отправить'); }
}

  if(c.v15) return; c.v15=1; c.tune=c.tune||0; if(!c.cond) c.cond=70;
  var b=okNum(c.value)?c.value/plateF(c):(c.baseValue||1000);
  c.baseValue=Math.round(b/condF(c.cond)); recalcCar(c);
}
function repairCost(c){ return Math.max(100,Math.round(c.baseValue*.3*(100-c.cond)/100/100)*100); }
function tuneCost(c){ return Math.max(100,Math.round(c.baseValue*TUNE[c.tune].cost/100)*100); }
function spendCar(cost){
  if(state.balance<cost){ SND.error(); toast('Не хватает денег'); return false; }
  changeBalance(-cost,true); state.stats.spent+=cost; return true;
}
function repairCar(c){
  carFix(c); if(c.cond>=100) return; var cost=repairCost(c);
  if(!spendCar(cost)) return;
  c.cond=100; recalcCar(c); state.stats.repairs=(state.stats.repairs||0)+1;
  SND.coin(); save(); updateControls(); checkAch(); toast('Машина отремонтирована · −'+fmt(cost)); renderShow();
}
function tuneCar(c){
  carFix(c); if((c.tune||0)>=TUNE.length) return; var cost=tuneCost(c);
  if(!spendCar(cost)) return;
  c.tune=(c.tune||0)+1; recalcCar(c); state.stats.tunes=(state.stats.tunes||0)+1;
  SND.level(); burst(60,TUNE[c.tune-1].neon); save(); updateControls(); checkAch();
  toast('🔧 '+TUNE[c.tune-1].n+' установлена · −'+fmt(cost)); renderShow();
}
function tuneBlock(c){
  var t=c.tune||0, col=c.cond<50?'#fb7185':(c.cond<80?'#facc15':'#34d058'), nx=TUNE[t];
  return '<div class="card"><div class="lv-top"><b style="font-size:18px">Состояние</b><span>'+c.cond+'%</span></div>'+
    '<div class="xp"><i style="width:'+c.cond+'%;background:'+col+'"></i></div>'+
    '<p class="lv-note">Состояние влияет на цену: убитая машина стоит до 25% дешевле. Ремонт обходится чуть дороже, чем прибавка к цене — это вложение в красоту.</p>'+
    '<button class="pill ghost" id="shRep" style="margin-top:10px;width:100%;height:46px;font-size:14px"'+(c.cond>=100?' disabled style="opacity:.5;margin-top:10px;width:100%;height:46px"':'')+'>'+(c.cond>=100?'Идеальное состояние':'Отремонтировать до 100% · '+fmt(repairCost(c)))+'</button></div>'+
    '<div class="card"><div class="lv-top"><b style="font-size:18px">Тюнинг</b><span>'+t+' / '+TUNE.length+'</span></div>'+
    '<p class="lv-note">Каждая стадия даёт неоновую подсветку в шоуруме и небольшую прибавку к цене, но стоит дороже, чем возвращает.'+(t?' Сейчас: +'+Math.round((TUNE[t-1].m-1)*100)+'% к цене.':'')+'</p>'+
    (nx?'<button class="pill ghost" id="shTune" style="margin-top:10px;width:100%;height:46px;font-size:14px;border-color:'+nx.neon+';color:'+nx.neon+'">'+nx.n+' · '+fmt(tuneCost(c))+' · +'+Math.round((nx.m-1)*100)+'%</button>':'<div class="sub-title" style="margin:10px 0 0;color:'+TUNE[TUNE.length-1].neon+'">Максимальный тюнинг</div>')+'</div>';
}

/* ---- постоянные темы ---- */
var THEME_HINT={vor:'Профессия тех, кто «работает» по ночам',ham:'Так называют грубияна',kot:'Пушистый любитель сметаны',tor:'Скандинавский бог грома',sss:'Страна, которой больше нет'};
function themeEgg(){
  var id=state.themeSel; if(!id||!state.eggs||!state.eggs[id]) return null;
  for(var i=0;i<EGGS.length;i++) if(EGGS[i].id===id) return EGGS[i];
  return null;
}
function themeAc(){ var e=themeEgg(); return e?e.ac:null; }
function renderThemes(){
  var cur=state.themeSel||'';
  function card(id,ic,name,sub,col,ok){
    var on=(cur===id);
    return '<div class="card" style="display:flex;align-items:center;gap:12px"><span style="width:38px;height:38px;border-radius:50%;background:'+col+';display:flex;align-items:center;justify-content:center;font-size:18px;flex:none">'+(ok?ic:'🔒')+'</span>'+
      '<div style="flex:1;min-width:0"><b style="font-size:15px">'+name+'</b><div class="sm">'+sub+'</div></div>'+
      (ok?(on?'<span class="rw" style="color:#4ade80;font-weight:800">✓ выбрана</span>':'<button class="tclaim th-pick" data-id="'+id+'">Применить</button>'):'')+'</div>';
  }
  var h='<div class="prof-in">'+head('Темы')+'<div class="sub-title">Найди секретный номер — его тема останется у тебя навсегда</div>'+
    card('','🌑','Стандартная','Тёмная классика','#2c2a33',true);
  EGGS.forEach(function(e){
    var f=state.eggs&&state.eggs[e.id];
    h+=f?card(e.id,'🥚',e.n,'открыта · выбито '+f+' раз',e.ac,true):card(e.id,'',  'Неизвестная тема','Подсказка: '+THEME_HINT[e.id],'#26252b',false);
  });
  $('prof').innerHTML=h+'</div>'; wireBack();
  $('prof').querySelectorAll('.th-pick').forEach(function(b){ b.onclick=function(){
    var id=b.getAttribute('data-id'); state.themeSel=id||null; save(); SND.click(); clearEgg();
    if(!state.pending) setAccent(themeAc()||'#9aa3ad');
    renderThemes();
  }; });
}

function openRaces(){
  var s=sheet('<div class="big-box" style="font-size:72px;line-height:1">🏁</div><h2>Гонки</h2>'+
    '<p class="d">Скоро здесь появятся заезды: выставляй машину на гонку, ставь деньги и забирай призы. Тюнинг и состояние машины будут влиять на шансы на победу.</p>'+
    '<div class="odds"><div class="tier-row"><span style="font-weight:800;color:#fb923c">Статус</span><span>🚧 В разработке</span></div></div>'+
    '<button class="pill green" id="rcOk">Понятно</button>');
  $('rcOk').onclick=s.close;
}

/* ================= INIT ================= */
function setMode(m){
  if(spinning||auto.on) return;
  mode=m; SND.click(); updateControls();
}
$('spinBtn').addEventListener('click',function(){ ac(); SND.click(); doSpin(); });
$('betBtn').addEventListener('click',function(){ ac(); SND.click(); openBetSheet(); });
$('autoBtn').addEventListener('click',function(){
  ac();
  if(auto.on){ stopAuto('Автокрутка остановлена'); }
  else{ SND.click(); openAutoSheet(); }
});
$('tabR').addEventListener('click',function(){ setMode('roulette'); });
$('tabC').addEventListener('click',function(){ setMode('cases'); });
$('sellBtn').addEventListener('click',sellCurrent);
$('keepBtn').addEventListener('click',keepCurrent);
$('shareBtn').addEventListener('click',openShare);
$('restartBtn').addEventListener('click',restart);
$('lvlBtn').addEventListener('click',function(){ ac(); SND.click(); openProfile(); });
$('dailyBtn').addEventListener('click',function(){ ac(); SND.click(); openDaily(); });
document.addEventListener('visibilitychange',function(){ if(document.hidden&&auto.on) stopAuto('Автокрутка остановлена'); });

$('menuBtn').addEventListener('click',function(){ ac(); SND.click(); openMenu(); });
load(); colEnsure(); colScan(); state.cases=padCases(state.cases); state.eggs=state.eggs||{}; sanitize(); state.inventory.forEach(function(x){ if(x.kind==='car') carFix(x); });
clearEgg(); setAccent(themeAc()||'#9aa3ad'); shownBal=state.balance; $('balance').textContent=fmt(state.balance);
renderLevel(); renderBet();
if(state.pending){
  if(state.pending.kind!=='car') setStatic(state.pending);
  showResult(state.pending);
  applyReveal(state.pending);
  if(state.pending.tier.id>=3) $(state.pending.kind==='car'?'raysS':'rays').classList.add('on');
}else{
  setStatic({letters:['А','В','С'],digits:'123',region:['77','Москва']});
  renderDots(null);
}
updateControls();
if(state.pending&&state.pending.kind==='car') showCarCard(state.pending);
checkAch();
var qp=null; try{ qp=new URLSearchParams(location.search).get('promo'); }catch(e){}
if(qp){ setTimeout(function(){ redeem(qp).then(function(r){ if(r!=='ok') toast(r); try{ history.replaceState(null,'',location.pathname); }catch(e){} }); },800); }
else if(dailyAvailable()&&!state.pending) setTimeout(openDaily,500);
}
</script>
<script>
/* ================= CLOUD SYNC (Cloudflare Worker) ================= */
(function(){
// ↓↓↓ ВСТАВЬ СЮДА АДРЕС СВОЕГО WORKER после деплоя (без / в конце) ↓↓↓
var API_URL='https://plate-roulette-api.yotonick.workers.dev';
// ↑↑↑
var KEY='plate_roulette_v3', OLDKEY='plate_roulette_v2', MKEY='plate_cloud_meta';
var tg=window.Telegram&&window.Telegram.WebApp;
try{ if(tg){ tg.ready(); tg.expand(); if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } }catch(e){}
var initData=(tg&&tg.initData)||'';
var uid=null; try{ uid=tg.initDataUnsafe.user.id; }catch(e){}
var enabled=!!(initData&&uid&&API_URL.indexOf('ВАШ_')<0);
var status=enabled?'подключение…':(initData?'адрес сервера не задан':'открой игру из Telegram');
var meta=readMeta(), timer=0, inflight=false, seq=0, bootMsg='', started=false;

function readMeta(){ try{ return JSON.parse(localStorage.getItem(MKEY))||{}; }catch(e){ return {}; } }
function writeMeta(){ try{ localStorage.setItem(MKEY,JSON.stringify(meta)); }catch(e){} }
function localState(){ try{ return JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLDKEY)||'null'); }catch(e){ return null; } }
function hasProgress(s){ return !!(s&&((s.spins||0)>0||(s.inventory&&s.inventory.length))); }
function spinsOf(s){ return (s&&s.spins)||0; }

async function api(method,body,ms,keepalive){
  var ctl=new AbortController(), t=setTimeout(function(){ ctl.abort(); },ms||8000);
  try{
    var r=await fetch(API_URL+'/save',{method:method,body:body||undefined,signal:ctl.signal,keepalive:!!keepalive,
      headers:{'Authorization':'tma '+initData,'Content-Type':'application/json'}});
    var j=null; try{ j=await r.json(); }catch(e){}
    return {status:r.status,json:j||{}};
  }finally{ clearTimeout(t); }
}

function adoptServer(data,rev){
  window.__cloudReload=true;               // game.save() больше не затрёт localStorage
  clearTimeout(timer);
  try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){}
  meta={uid:uid,rev:rev,dirty:false}; writeMeta();
}

async function boot(){
  if(!enabled) return;
  var first=!meta.uid;
  if(meta.uid&&meta.uid!==uid){            // на этом устройстве раньше играл другой аккаунт
    try{ localStorage.removeItem(KEY); localStorage.removeItem(OLDKEY); }catch(e){}
    meta={uid:uid,rev:0,dirty:false}; writeMeta(); first=true;
  }
  var r;
  try{ r=await api('GET',null,5000); }catch(e){ status='нет связи с сервером'; return; }
  if(r.status!==200){ status='ошибка сервера ('+r.status+')'; return; }
  var sv=r.json, local=localState();
  if(!sv.exists){
    meta={uid:uid,rev:0,dirty:hasProgress(local)}; writeMeta();
    if(meta.dirty) push();                 // первая загрузка существующего прогресса в облако
    else status='синхронизировано';
    return;
  }
  var take=false, doPush=false;
  if(first){
    if(!hasProgress(local)) take=true;
    else if(spinsOf(local)>spinsOf(sv.data)) doPush=true; else take=true;
  }else if(meta.force) doPush=true;
  else if(meta.dirty){
    if(sv.rev===meta.rev) doPush=true;
    else if(spinsOf(local)>spinsOf(sv.data)) doPush=true; else take=true;
  }else if(sv.rev>meta.rev) take=true;
  else status='синхронизировано';
  if(take){
    try{ localStorage.setItem(KEY,JSON.stringify(sv.data)); }catch(e){}
    meta={uid:uid,rev:sv.rev,dirty:false}; writeMeta();
    bootMsg='☁️ Прогресс загружен из облака'; status='синхронизировано';
  }else if(doPush){
    meta={uid:uid,rev:sv.rev,dirty:true}; writeMeta(); push();
  }
}

async function push(){
  if(!enabled||inflight||window.__cloudReload) return;
  var raw=localStorage.getItem(KEY); if(!raw) return;
  var body, s=seq;
  try{ body=JSON.stringify({data:JSON.parse(raw),rev:meta.rev||0}); }catch(e){ return; }
  inflight=true; status='сохраняю…';
  try{
    var r=await api('PUT',body,8000,body.length<60000);
    if(r.status===200){
      meta.uid=uid; meta.rev=r.json.rev; meta.force=false;
      if(seq===s) meta.dirty=false; else schedule(300);
      writeMeta(); status='синхронизировано';
    }else if(r.status===409){ resolveConflict(r.json); }
    else status='ошибка сервера ('+r.status+')';
  }catch(e){ status='нет связи — сохраню позже'; schedule(15000); }
  inflight=false;
}
function resolveConflict(c){
  var local=localState();
  if(c.data&&spinsOf(c.data)>spinsOf(local)){
    adoptServer(c.data,c.rev); status='загружено из облака';
    showMsg('☁️ На другом устройстве прогресс ушёл вперёд — загружаю его'); setTimeout(function(){ location.reload(); },1500);
  }else{ meta.rev=c.rev; meta.dirty=true; writeMeta(); schedule(100); }
}
function schedule(ms){ clearTimeout(timer); timer=setTimeout(push,ms); }
function queue(){
  if(!enabled||window.__cloudReload) return;
  meta.uid=uid; meta.dirty=true; seq++; writeMeta(); schedule(3000);
}
async function refresh(){                    // вернулись в приложение: не появилось ли что-то новое с другого устройства
  if(!enabled||meta.dirty||inflight||window.__cloudReload) return;
  try{
    var r=await api('GET',null,5000);
    if(r.status===200&&r.json.exists&&r.json.rev>(meta.rev||0)&&!meta.dirty){
      if(typeof spinning!=='undefined'&&spinning) return;
      adoptServer(r.json.data,r.json.rev); status='загружено из облака';
      showMsg('☁️ Загружен прогресс с другого устройства'); setTimeout(function(){ location.reload(); },1200);
    }else if(r.status===200) status='синхронизировано';
  }catch(e){}
}
function showMsg(t){
  var c=document.getElementById('toasts'); if(!c) return;
  var d=document.createElement('div'); d.className='toast'; d.textContent=t; c.appendChild(d); setTimeout(function(){ d.remove(); },3500);
}

window.__cloudQueue=queue;
window.__cloudMarkDirty=function(force){ if(!enabled) return; meta.uid=uid; meta.dirty=true; meta.force=!!force; seq++; writeMeta(); };
window.__cloudInfo=function(){ return status+(enabled?' · v'+(meta.rev||0):'')+' ›'; };
window.__cloudSyncNow=async function(){
  if(!enabled) return status==='открой игру из Telegram'?'Облако работает только внутри Telegram':'Не задан адрес сервера в index.html';
  if(meta.dirty){ clearTimeout(timer); await push(); } else await refresh();
  return '☁️ '+status;
};

document.addEventListener('visibilitychange',function(){
  if(document.hidden){ if(meta.dirty){ clearTimeout(timer); push(); } }
  else refresh();
});
// Telegram (особенно десктоп) не всегда шлёт visibilitychange, поэтому проверяем сервер ещё и по таймеру/фокусу.
window.addEventListener('focus',function(){ refresh(); });
window.addEventListener('pageshow',function(){ refresh(); });
window.addEventListener('online',function(){ if(meta.dirty) schedule(100); else refresh(); });
try{ if(tg&&tg.onEvent){ tg.onEvent('activated',function(){ refresh(); }); tg.onEvent('deactivated',function(){ if(meta.dirty){ clearTimeout(timer); push(); } }); } }catch(e){}
setInterval(function(){ if(!document.hidden) refresh(); },10000);
window.addEventListener('pagehide',function(){ if(meta.dirty){ clearTimeout(timer); push(); } });

function start(){
  if(started) return; started=true;
  __startGame();
  if(bootMsg) setTimeout(function(){ showMsg(bootMsg); },1800);
}
boot().catch(function(){ status='ошибка синхронизации'; }).then(start);
})();
</script>
<script>(function(){
function isField(t){ return t&&t.closest&&t.closest('input,textarea'); }
['gesturestart','gesturechange','gestureend'].forEach(function(n){ document.addEventListener(n,function(e){ e.preventDefault(); },{passive:false}); });
var lastT=0;
document.addEventListener('touchend',function(e){
  if(isField(e.target)) return;
  var n=Date.now(); if(n-lastT<350&&e.cancelable) e.preventDefault(); lastT=n;
},{passive:false});
document.addEventListener('touchmove',function(e){ if(e.touches&&e.touches.length>1&&e.cancelable) e.preventDefault(); },{passive:false});
document.addEventListener('dblclick',function(e){ if(!isField(e.target)) e.preventDefault(); },{passive:false});
document.addEventListener('contextmenu',function(e){ if(!isField(e.target)) e.preventDefault(); });
document.addEventListener('selectstart',function(e){ if(!isField(e.target)) e.preventDefault(); });
document.addEventListener('dragstart',function(e){ e.preventDefault(); });
document.addEventListener('wheel',function(e){ if(e.ctrlKey) e.preventDefault(); },{passive:false});
document.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&(e.key==='+'||e.key==='-'||e.key==='='||e.key==='0')) e.preventDefault(); });
})();</script>
